name: Release (signed Android)

# Tag bilan ishga tushadi:  git tag -s v1.1.0 -m "PulseLink 1.1.0" && git push origin v1.1.0
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Release build uchun server manzili (https://...)'
        required: false

permissions:
  contents: write        # GitHub Release yaratish
  id-token: write        # build provenance imzosi (Sigstore)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Versiya va tag mosligi
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/set-version.js --check "$TAG"
          else
            node scripts/set-version.js --check
          fi
          echo "VERSION_NAME=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(grep '^VERSION_CODE=' android/gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Imzolash kalitlari mavjudligini tekshirish
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for v in KS_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret yo'q: $v (scripts/generate-keystore.sh ga qarang)"; missing=1; fi
          done
          exit $missing

      - name: Keystore'ni tiklash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Imzolangan APK va AAB build
        working-directory: android
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || vars.SERVER_URL }}
        run: |
          EXTRA=""
          if [ -n "$SERVER_URL" ]; then EXTRA="-PSERVER_URL=$SERVER_URL"; fi
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace $EXTRA

      - name: Imzoni tekshirish
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-cert.txt"
          jarsigner -verify "$AAB" | head -3
          if [ -n "${{ vars.ANDROID_CERT_SHA256 }}" ]; then
            ACTUAL=$(grep -i "certificate SHA-256 digest" "$RUNNER_TEMP/apk-cert.txt" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
            EXPECTED=$(echo "${{ vars.ANDROID_CERT_SHA256 }}" | tr -d ':' | tr 'A-F' 'a-f')
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::Imzo sertifikati kutilgan sertifikatga mos emas"; exit 1; }
            echo "Sertifikat SHA-256 mos."
          fi

      - name: Artefaktlarni nomlash va SHA-256 hisoblash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/pulselink-${VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "dist/pulselink-${VERSION_NAME}.aab"
          [ -f android/app/build/outputs/mapping/release/mapping.txt ] && cp android/app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION_NAME}.txt" || true
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Build provenance (Sigstore imzosi)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/pulselink-*.apk
            dist/pulselink-*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: pulselink-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Keystore'ni o'chirish
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
