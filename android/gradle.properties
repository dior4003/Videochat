org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Versiya — yagona manba. CI'da -PVERSION_NAME=... -PVERSION_CODE=... bilan (git tag'dan) almashtiriladi.
# O'zgartirish: `node scripts/set-version.js 1.2.0` (barcha komponentlarni sinxron yangilaydi).
VERSION_NAME=1.1.0
VERSION_CODE=10100

# Release build uchun server manzili (HTTPS majburiy): -PSERVER_URL=https://api.example.com
SERVER_URL=https://api.pulselink.example
